spring.application.name=client-app
server.port=8080

env=${ENV:dev}
spring.profiles.active=${env}
server.ssl.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:financedevapp-do-user-18420878-0.i.db.ondigitalocean.com}:${DB_PORT:25060}/${DB_NAME:defaultdb}?ssl-mode=REQUIRED
spring.datasource.username=${DB_USERNAME:doadmin}
spring.datasource.max-active=1000
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximumPoolSize=${HIKARI_MAXIMUM_POOL_SIZE:20}
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.hibernate.ddl-auto=none
# spring.liquibase.enabled = true
spring.jpa.properties.hibernate.format_sql=true
spring.liquibase.changelog=classpath:db/changelog/db.changelog-master.yaml
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false