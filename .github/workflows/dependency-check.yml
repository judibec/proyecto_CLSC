name: Security - Trivy Vulnerability Scan

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write   # Para subir resultados a GitHub Code Scanning

jobs:
  trivy-scan:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache de Maven para no redescargar dependencias
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Resolver dependencias del proyecto (sin compilar)
      - name: Resolver dependencias Maven
        run: mvn dependency:resolve --no-transfer-progress -q
      # Para Gradle usar: ./gradlew dependencies --no-daemon -q

      # Cache de la DB de Trivy (es ligera ~50MB, a diferencia de NVD)
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Escaneo principal — genera tabla en consola + reporte SARIF
      - name: Trivy - escaneo de dependencias
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'                  # filesystem scan
          scan-ref: '.'                    # raíz del proyecto
          scanners: 'vuln'                 # solo vulnerabilidades (no secrets/misconfig)
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'        # solo reporta High y Critical
          exit-code: '1'                   # falla el build si encuentra vulnerabilidades
          ignore-unfixed: true             # ignora CVEs sin fix disponible
          vuln-type: 'library'             # solo librerías (no OS packages)

      # Subir resultados al tab "Security > Code Scanning" de GitHub (gratis)
      - name: Subir resultados a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-dependency-scan'

      # Reporte legible en consola (adicional al SARIF)
      - name: Trivy - reporte en tabla
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'library'

      # Subir el SARIF como artifact descargable
      - name: Subir reporte SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ github.event.pull_request.number }}
          path: trivy-results.sarif
          retention-days: 30

      # Comentar resumen en el PR
      - name: Comentar resultado en el PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### Trivy — Reporte de vulnerabilidades\n\n';

            try {
              const sarif = JSON.parse(fs.readFileSync('trivy-results.sarif', 'utf8'));
              const results = sarif.runs?.[0]?.results ?? [];
              const critical = results.filter(r => r.level === 'error').length;
              const high = results.filter(r => r.level === 'warning').length;

              if (results.length === 0) {
                body += '**No se encontraron vulnerabilidades HIGH o CRITICAL.**\n';
              } else {
                body += `Se encontraron **${results.length}** vulnerabilidades: ${critical} críticas, ${high} altas.\n\n`;
                body += '| CVE | Paquete | Severidad | Fix disponible |\n|---|---|---|---|\n';
                results.slice(0, 15).forEach(r => {
                  const rule = sarif.runs[0].tool.driver.rules?.find(x => x.id === r.ruleId);
                  const severity = r.level === 'error' ? 'CRITICAL' : 'HIGH';
                  const pkg = r.locations?.[0]?.physicalLocation?.artifactLocation?.uri ?? '-';
                  const fix = rule?.help?.text?.includes('fixed') ? 'Sí' : 'Revisar';
                  body += `| ${r.ruleId} | ${pkg.split('/').pop()} | ${severity} | ${fix} |\n`;
                });
                if (results.length > 15) body += `\n_...y ${results.length - 15} más._\n`;
              }
            } catch(e) {
              body += '_No se pudo leer el reporte SARIF._\n';
            }

            body += `\n[Ver en Code Scanning](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/security/code-scanning)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });