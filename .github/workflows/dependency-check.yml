name: Security - Dependency Check

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # Para comentar en el PR

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código del PR
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache de la base de datos NVD (evita descargarla en cada ejecución)
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-db-${{ runner.os }}-

      # 4. Cache de dependencias Maven
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # ── Si usas Gradle, reemplaza los pasos 4 y 5 con los de Gradle ──

      # 5. Ejecutar análisis de vulnerabilidades
      - name: Ejecutar OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DnvdApiKey=$NVD_API_KEY \
            -DdataDirectory=$HOME/.dependency-check/data \
            --no-transfer-progress
        # Para Gradle usar: ./gradlew dependencyCheckAnalyze -PnvdApiKey=$NVD_API_KEY

      # 6. Subir el reporte como artifact descargable
      - name: Subir reporte HTML
        uses: actions/upload-artifact@v4
        if: always()   # Subir aunque el build falle
        with:
          name: dependency-check-report-${{ github.event.pull_request.number }}
          path: target/dependency-check-report/
          retention-days: 30

      # 7. Comentar en el PR con el resumen (opcional pero muy útil)
      - name: Comentar resultado en el PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '### Reporte OWASP Dependency-Check\n\n';

            try {
              const json = fs.readFileSync(
                'target/dependency-check-report/dependency-check-report.json',
                'utf8'
              );
              const report = JSON.parse(json);
              const vulns = report.dependencies?.filter(d => d.vulnerabilities?.length > 0) || [];

              if (vulns.length === 0) {
                summary += '✅ **No se encontraron vulnerabilidades conocidas.**\n';
              } else {
                summary += `⚠️ **Se encontraron dependencias con vulnerabilidades: ${vulns.length}**\n\n`;
                summary += '| Dependencia | CVEs | CVSS máx |\n|---|---|---|\n';
                vulns.slice(0, 10).forEach(dep => {
                  const maxCvss = Math.max(...dep.vulnerabilities.map(v => v.cvssv3?.baseScore || v.cvssv2?.score || 0));
                  const cves = dep.vulnerabilities.map(v => v.name).join(', ');
                  summary += `| ${dep.fileName} | ${cves} | ${maxCvss} |\n`;
                });
                if (vulns.length > 10) summary += `\n_...y ${vulns.length - 10} más. Ver el artifact completo._\n`;
              }
            } catch(e) {
              summary += '_No se pudo leer el reporte JSON._\n';
            }

            summary += `\n[Ver artifact completo](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });