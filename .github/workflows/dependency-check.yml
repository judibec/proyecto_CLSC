name: Security - Trivy Vulnerability Scan

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  trivy-scan:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Resolver dependencias Maven
        run: mvn dependency:resolve --no-transfer-progress -q

      # Fecha para el caché diario de Trivy
      - name: Obtener fecha actual
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Caché correcto — clave por fecha, no por run_id
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-

      # PASO 1 — Tabla legible en consola (no bloquea)
      - name: Trivy - reporte en tabla
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'library'
          exit-code: '0'

      # PASO 2 — Genera SARIF y bloquea si hay vulnerabilidades
      - name: Trivy - escaneo bloqueante
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'

      - name: Subir resultados a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-dependency-scan'

      - name: Subir reporte como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ github.event.pull_request.number }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Comentar resultado en el PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### Trivy — Reporte de vulnerabilidades\n\n';
            try {
              const sarif = JSON.parse(fs.readFileSync('trivy-results.sarif', 'utf8'));
              const results = sarif.runs?.[0]?.results ?? [];
              const critical = results.filter(r => r.level === 'error').length;
              const high = results.filter(r => r.level === 'warning').length;
              if (results.length === 0) {
                body += '**No se encontraron vulnerabilidades HIGH o CRITICAL.**\n';
              } else {
                body += `Se encontraron **${results.length}** vulnerabilidades: ${critical} críticas, ${high} altas.\n\n`;
                body += '| CVE | Paquete | Severidad |\n|---|---|---|\n';
                results.slice(0, 15).forEach(r => {
                  const severity = r.level === 'error' ? 'CRITICAL' : 'HIGH';
                  const pkg = r.locations?.[0]?.physicalLocation?.artifactLocation?.uri ?? '-';
                  body += `| ${r.ruleId} | ${pkg.split('/').pop()} | ${severity} |\n`;
                });
                if (results.length > 15) body += `\n_...y ${results.length - 15} más._\n`;
              }
              body += `\n[Ver en Code Scanning](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/security/code-scanning)`;
            } catch(e) {
              body += '_No se pudo leer el reporte SARIF._\n';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });