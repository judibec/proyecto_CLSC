name: Security Gate

on:
  pull_request:
    branches: [main, develop]

jobs:
  # ── 1. SAST con CodeQL ─────────────────────────────────────────────
  sast:
    name: SAST – CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended,security-and-quality

      - name: Build módulo backend
        working-directory: modules/finance-dev-app-backend
        run: mvn -B package -DskipTests

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java

  # ── 3. Secrets ─────────────────────────────────────────────────────
  secrets:
    name: Secrets – Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # escanea todo el historial git

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Licencias ───────────────────────────────────────────────────
  licenses:
    name: Licencias – Maven License Plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Verificar licencias de dependencias
        working-directory: modules/finance-dev-app-backend
        run: |
          mvn -B org.codehaus.mojo:license-maven-plugin:2.4.0:add-third-party \
          -Dlicense.failIfWarning=true \
          -Dlicense.includedLicenses="MIT|Apache-2.0|BSD-2-Clause|BSD-3-Clause|ISC|LGPL-2.1"

      - name: Subir reporte de licencias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licenses-report
          path: modules/finance-dev-app-backend/target/generated-sources/license/
        # Si usas Gradle: ./gradlew checkLicense