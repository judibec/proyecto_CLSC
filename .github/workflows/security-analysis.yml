name: Security Analysis with Snyk

on:
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  snyk-security:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk vulnerability scan
        run: |
          snyk test \
            --severity-threshold=high \
            --sarif-file-output=snyk.sarif \
            --json-file-output=snyk.json \
            || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
          category: snyk-dependency-scan

      - name: Comment results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Snyk — Reporte de vulnerabilidades\n\n';
            try {
              const report = JSON.parse(fs.readFileSync('snyk.json', 'utf8'));
              const vulns = report.vulnerabilities || [];
              if (vulns.length === 0) {
                body += '✅ Sin vulnerabilidades HIGH o CRITICAL.';
              } else {
                body += `⚠️ **${vulns.length}** vulnerabilidades encontradas:\n\n`;
                body += '| Paquete | CVE | Severidad | Fix |\n|---|---|---|---|\n';
                vulns.slice(0, 20).forEach(v => {
                  const fix = v.fixedIn?.length ? `v${v.fixedIn[0]}` : 'No disponible';
                  body += `| \`${v.moduleName}\` | ${v.identifiers?.CVE?.[0] || v.id} | ${v.severity} | ${fix} |\n`;
                });
              }
            } catch(e) { body += '_Reporte no disponible._'; }
