name: Security Dependency Analysis

on:
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  dependency-analysis:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve dependency tree
        run: mvn dependency:tree -DoutputFile=dependency-tree.txt --no-transfer-progress

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: '${{ github.repository }}'
          path: '.'
          format: 'HTML,SARIF,JSON'
          args: >
            --enableRetired
            --failOnCVSS 7
        # ✅ Sin bloque env — el contenedor usa su Java interno

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: reports/
          retention-days: 14

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Comment results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Reporte de vulnerabilidades\n\n';
            try {
              const report = JSON.parse(fs.readFileSync('reports/dependency-check-report.json', 'utf8'));
              const vulns = report.dependencies?.filter(d => d.vulnerabilities?.length > 0) || [];
              if (vulns.length === 0) {
                body += '✅ Sin vulnerabilidades conocidas.';
              } else {
                body += `⚠️ **${vulns.length}** dependencias afectadas:\n\n| Dependencia | CVE | Severidad |\n|---|---|---|\n`;
                vulns.slice(0, 20).forEach(d => d.vulnerabilities.forEach(v => {
                  body += `| \`${d.fileName}\` | ${v.name} | ${v.severity} |\n`;
                }));
              }
            } catch(e) { body += '_Reporte no disponible._'; }
            github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body });