name: Security Analysis with Snyk

on:
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  snyk-security:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk vulnerability scan
        run: |
          snyk test \
            --severity-threshold=high \
            --json \
            > snyk.json 2>snyk-error.log || true
          echo "--- Primeros 300 chars de snyk.json ---"
          head -c 300 snyk.json
          echo ""
          echo "--- snyk-error.log ---"
          cat snyk-error.log || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Generate SARIF from JSON
        run: |
          cat > generate-sarif.js << 'JSEOF'
          const fs = require('fs');
          let raw = fs.readFileSync('snyk.json', 'utf8').trim();
          let report;
          try {
            report = JSON.parse(raw);
          } catch(e) {
            console.error('Parse directo fallo, intentando extraccion...');
            const idx = raw.lastIndexOf('}');
            if (idx !== -1) {
              try { report = JSON.parse(raw.substring(0, idx + 1)); }
              catch(e2) { report = { vulnerabilities: [] }; }
            } else {
              report = { vulnerabilities: [] };
            }
          }
          const vulns = report.vulnerabilities || [];
          const seen = {};
          const rules = [];
          vulns.forEach(function(v) {
            if (!seen[v.id]) {
              seen[v.id] = true;
              rules.push({
                id: v.id,
                shortDescription: { text: v.title || v.id },
                helpUri: v.url || 'https://snyk.io',
                properties: { tags: [v.severity] }
              });
            }
          });
          const sarif = {
            version: '2.1.0',
            '$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
            runs: [{
              tool: {
                driver: {
                  name: 'Snyk',
                  version: '1.0.0',
                  informationUri: 'https://snyk.io',
                  rules: rules
                }
              },
              results: vulns.map(function(v) {
                return {
                  ruleId: v.id,
                  level: v.severity === 'critical' ? 'error' : 'warning',